<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
        <h1 class="logo">EMPD <span>Photography</span></h1>
        <nav class="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="service.html">Services</a></li>
                <li><a href="book.html" class="active">Book</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="page-hero">
            <h1>Bookings</h1>
            <p>Client Form</p>
        </section>

        <section class="booking-form-wrap">
            <form class="booking-form">

                <fieldset>
                    <legend>Your Details</legend>

                    <label for="Name">Full Name</label>
                    <input type="text" id="Name" name="Name" required>

                    <label for="Surname">Surname</label>
                    <input type="text" id="Surname" name="Surname" required>

                    <label for="Address">Address</label>
                    <input type="text" id="Address" name="Address" required>

                    <label for="City">City</label>
                    <input type="text" id="City" name="City" required>

                    <label for="Country">Country</label>
                    <input type="text" id="Country" name="Country" required>
                </fieldset>

                <fieldset>
                    <legend>Event Details</legend>

                    <label for="Venu">Venue Name</label>
                    <input type="text" id="Venu" name="Venu" required>

                    <label for="VenuAddress">Venue Address</label>
                    <input type="text" id="VenuAddress" name="VenuAddress" required>

                    <label for="Time">Event Time</label>
                    <input type="text" id="Time" name="Time" required>
                </fieldset>

                <button type="submit" class="btn btn-primary">Submit</button>

            </form>
        </section>

    </main>

    <footer class="site-footer">
        <h4>Prefer to go to?</h4>
        <ul class="footer-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="service.html">Services</a></li>
            <li><a href="book.html">Book</a></li>
        </ul>
        <p>&copy; 2026 EMPD Photography. All rights reserved.</p>
    </footer>
    
</body>
</html>
